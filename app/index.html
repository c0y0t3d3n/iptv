<html>
    <head>
        <title>tuner</title>
        <style>
            body{font-family:monospace}
            th{text-align:left}
            /* Style the tab */
            .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
            }

            /* Style the buttons that are used to open the tab content */
            .tab button {
            font-family:monospace;
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            }

            /* Change background color of buttons on hover */
            .tab button:hover {
            background-color: #ddd;
            }

            /* Create an active/current tablink class */
            .tab button.active {
            background-color: #ccc;
            }

            /* Style the tab content */
            .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
            }
        </style>
        <script>
            const filter_types=['group_rename','groups','streams','streams_exclude','rename','replace','map','order']
            var timer
            var scanning = false
            var UPPER

            async function load_status() {
                clearTimeout(timer)
		        stat = await fetch('/status').then((r) => r.json())
                html=''
                if (stat) {
                    if (scanning) html+=`<p>rescanning...`
                    else {
                        html=`<p><button onclick=rescan()>rescan</button>&nbsp;`
                        if (stat.lineup_nstreams) html+=`${stat.lineup_ngroups} groups ${stat.lineup_nstreams} streams`
                            if (stat.lineup_cached) html+= ` cached for ${stat.lineup_cached}s`
                        else html+=`no lineup available`
                    }
                    html+=`</p>\n<p>`
                    if (Object.entries(stat.sources).length) {
                        html+=`<table><tr><th></th><th>user</th><th>pass</th><th>pri</th><th colspan=2>status</th><th>expires</th>`
                        if (stat.sources_cached) html+=`<td>(cached for ${stat.sources_cached}s)</td>`
                        html+=`</tr>\n`
                        for ([source,accounts] of Object.entries(stat.sources)) {
                            html+=`<tr><th colspan=7>${source}</th>\n`
                            if (stat.sources_nstreams[source]) html+=`<td>(${stat.sources_nstreams[source]} streams ${stat.sources_ngroups[source]} groups)</td></tr>\n`
                            for (a of accounts) html+=`<tr><td></td><td>${a.username}</td><td>${a.password}</td><td>${a.priority}</td><td>${a.active_conns}/${a.max_conns}</td><td>${a.status}</td><td>${a.expires}</td></tr>\n`
                        }
                        html+=`</table>\n`
                    }
                    html+='</p>\n'
                    m3u=`${window.location.origin}/m3u`
                    html+=`<p><table><tr><th>M3U</th><td><a href='${m3u}'>${m3u}</a></td>`
                    html+=`</tr>\n`
                    xmltv=`${window.location.origin}/xmltv`
                    html+=`<tr><th>XMLTV</th><td><a href='${xmltv}'>${xmltv}</a></td>`
                    if (stat.xmltv_channels) html+=`<td>(${stat.xmltv_channels} channels ${stat.xmltv_programs} programs)</td>`
                    html+=`</tr></table></p>\n`
                    if (Object.entries(stat.procs).length){
                        html+=`<p><table><tr><th></th><th>pid</th><th>client</th><th>stream</th><th>cmd</th>\n`
                        for ([pid,p] of Object.entries(stat.procs)) html+=`<tr><td>[<a href=#/ onclick=killProc(${pid})>x</a>]</td><td>${pid}</td><td>${p.client}</td><td>${p.stream}</td><td>${p.cmd}</td></tr>\n`
                        html+=`</table></p>\n`
                    }
                    document.getElementById('status').innerHTML=html
                    for (l of await fetch('/log').then((r) => r.json())) document.getElementById('logdata').textContent+=l+'\n'
                }
                timer=setTimeout(load_status,1000)
            }

            async function rescan() {
                scanning=true
                await fetch('/status',{
                    method:'POST',
                    body: new URLSearchParams({ rescan: 1 })
                }).then(() => scanning=false)
            }
            
            async function killProc(pid){
                await fetch('/status',{
                    method:'POST',
                    body: new URLSearchParams({ kill: pid })
		        })
            }

            async function load_log() {
                load_status()
            }

            async function load_sources() {
                sources=await fetch('/sources').then((r) => r.json())
                html=`<datalist id=priority>`
                html+=`</datalist>\n`
                html+=`<p><input type=text size=80 id=add><button onclick=addAccount(document.getElementById('add').value)>add</button></p>\n<table><tr><th colspan=4>source/accounts</th><th>priority</th></tr>\n`
                sourcesList=Object.entries(sources)
                for ([source,source_data] of sourcesList){
                    html+=`<tr><td>`
                    if (source_data.disabled) html+=`<input type=checkbox onchange=updateSource('${source}',${source_data.priority},0)>`
                    else html+=`<input type=checkbox checked=true onchange=updateSource('${source}',${source_data.priority},1)>`
                    html+=`</td><th colspan=3>${source_data.disabled?'<s>':''}${source}${source_data.disabled?'</s>':''}</th>`
                    html+=`<td><select onchange=updateSource('${source}',this.value,${source_data.disabled}?1:0)>`
                    for (i=0; i<sourcesList.length; i++) {
                        html+=`<option value=${i}`
                        if (i==source_data.priority) html+=' selected=true'
                        html+=`>${i}</option>`
                    }
                    html+=`</select></td></tr>\n`
                    for (a of source_data.accounts) {
                        html+=`<tr><td><button onclick=removeAccount('${source}','${a.username}','${a.password}')>&times;</button></td><td>`
                        if (a.disabled) html+=`<input type=checkbox onchange=updateAccount('${source}','${a.username}','${a.password}',0)>`
                        else html+=`<input type=checkbox checked=true onchange=updateAccount('${source}','${a.username}','${a.password}',1)>`
                        html+=`</td><td>${a.disabled?'<s>':''}${a.username}${a.disabled?'</s>':''}</td><td>${a.disabled?'<s>':''}${a.password}${a.disabled?'</s>':''}</td></tr>\n`
                    }
                }
                html+=`</table>\n`
                document.getElementById('sources').innerHTML=html
                load_status()
            }

            async function updateSource(source,priority,disabled) {
                await fetch('/sources',{
                    method:'POST',
                    body: new URLSearchParams({ 
                        update: source, 
                        priority: priority,
                        disabled: disabled
                    })
                })
                load_sources()
            }

            async function removeAccount(source,username,password) {
                await fetch('/sources',{
                    method:'POST',
                    body: new URLSearchParams({ 
                        remove: source, 
                        username: username,
                        password: password 
                    })
                })
                load_sources()
            }

            async function updateAccount(source,username,password,disabled) {
                await fetch('/sources',{
                    method:'POST',
                    body: new URLSearchParams({ 
                        update: source, 
                        username: username,
                        password: password,
                        disabled: disabled 
                    })
                })
                load_sources()
            }

            async function addAccount(add) {
                await fetch('/sources',{
                    method:'POST',
                    body: new URLSearchParams({ 
                        add: add, 
                    })
                })
                load_sources()
            }

            async function load_config() {
                current=await fetch('/config?defaults=1').then((r) => r.json())
                config=await fetch('/config?defaults=0').then((r) => r.json())
                html=`<p><button onclick=editConfigJSON()>JSON editor</button></p><p><form id=config_form><table>`
                for ([k,v] of Object.entries(current))
                    if (typeof v != 'object'){
                        if (typeof v == 'boolean') v=v?1:0
                        if (k in config) cv=config[k] 
                        else cv=''
                        if (typeof cv == 'boolean') cv=cv?1:0
                        html+=`<tr><th>${k}</th><td><input type=text length=80 name=${k} value='${cv}'"></td><td>${v}</td></tr>\n`
                    }
                html+=`</table></form><button onclick=saveConfig()>save</button>`
                document.getElementById('config').innerHTML=html
            }

            async function saveConfig() {
                await fetch('/config',{ 
                    method: 'POST', 
                    body: new URLSearchParams(
                        Array.from(new FormData(document.getElementById('config_form')))
                        )
                })
                load_config()
            }

            async function editConfigJSON() {
                json=await fetch('/config.json').then((r) => r.text())
                openExtraTab(`<textarea rows=50 cols=80 id=json>${json}</textarea><p><button onclick=saveConfigJSON(document.getElementById('json').value)>save</button></p>`,'JSON editor')
            }

            async function saveConfigJSON(json) {
                await fetch('/config',{ 
                    method: 'POST', 
                    body: new URLSearchParams({'config':json})
                })
                editConfigJSON()
            }

            async function load_lineup(){
                currentPage=load_lineup
                data=await fetch('/lineup').then((r) => r.json())
                html=`<p><table>\n`
                for ([group,streams] of Object.entries(data.lineup)){
                    html+=`<tr><th colspan=3 id='${group}'>${group}</a></th></tr>\n`
                    //first char of hostname if source  link  epgid
                    for (s of streams) {
                        html+=`<tr><td>`
                        for (u of Object.keys(s.sources)) html+=u.split('/')[2].substr(0,1)
                        html+=`</td><td><a href='${s.URL}'>${s.GuideName}</a></td><td>${s.GuideID}</td></tr>\n`
                    }
                }
                html+=`</table></p>\n<p><table>\n`
                all_groups=[]
                for ([source,groups] of Object.entries(data.groups)) {
                    html+=`<tr><th><a href=#/ onclick=sourceLineup('${source}')>${source}</a></th><td>`
                    sg=[]
                    for (group of groups) {
                        all_groups.push(group)
                        sg.push((group in data.lineup)?`<a href='#${group}'>${group}</a>`:group)
                    }
                    html+=sg.join()
                    html+=`</td></tr>\n`    
                }
                html+=`</table></p>\n<datalist id=groups-select>\n`
                for (group of all_groups) html+=`<option value='${group.replaceAll('|','\\|')}'/>`
                html+=`</datalist>\n<datalist id=order-select>\n`
                for (group of Object.keys(data.lineup)) html+=`<option value='${group.replaceAll('|','\\|')}'/>`
                html+=`</datalist>\n<p><table>`
                config=await fetch('/config').then((r) => r.json())
                UPPER=config.upper
                for (filter_type of filter_types) {
                    html+=`<tr><th colspan=2>${filter_type}</th></tr>`
                    for (filter_text of config[filter_type]) html+=`<tr><td>[<a href=#/ onclick="updateFilter('${filter_type}','${filter_text.replaceAll('\\','\\\\')}',true)">x</a>]</td><td>${filter_text}</td></tr>`
                    html+=`<tr><td></td><td><input type=text size=40 id=${filter_type} list=${filter_type}-select>`
                    html+=`[<a href=#/ onclick=updateFilter('${filter_type}',document.getElementById('${filter_type}').value,false)>add</a>]<br>&nbsp;</td></tr>`
                }
                html+=`</table></p>`
                document.getElementById('lineup').innerHTML=html
            }

            async function updateFilter(filter_type,filter_text,remove) {
                params=remove?{'remove':true}:{}
                params[filter_type]=UPPER?filter_text.toUpperCase():filter_text
                await fetch('/config',{
                    method:'POST',
                    body: new URLSearchParams(params)
                })
                load_lineup()
            }

            async function sourceLineup(source) {
                data=await fetch('/lineup?source='+source).then(function(r) {return r.json()})
                html=`<table>`
                for ([gid,group] of Object.entries(data.groups)){
                    html+=`<tr></tr><tr><th>${group}</th></tr>\n`
                    for (stream of data.streams) if (stream.category_id == gid) html+=`<tr><td>${stream.name}</td><td>${stream.epg_channel_id}</td></tr>\n`
                }
                html+=`</table>`
                openExtraTab(html,source)
            }

            async function openTab(evt, tab) {
                // Get all elements with class="tabcontent" and hide them
                tabcontent = document.getElementsByClassName("tabcontent");
                for (i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "none";
                }

                // Get all elements with class="tablinks" and remove the class "active"
                tablinks = document.getElementsByClassName("tablinks");
                for (i = 0; i < tablinks.length; i++) {
                    tablinks[i].className = tablinks[i].className.replace(" active", "");
                }

                // Show the current tab, and add an "active" class to the link that opened the tab
                document.getElementById(tab).style.display = "block";
                evt.currentTarget.className += " active";

                // update the displayed tab
                self['load_'+tab]()
            }

            async function load_extra() {} //do nothing but has to exist

            async function openExtraTab(html,name){
                document.getElementById('extra_data').innerHTML=html
                document.getElementById('extra_tab').innerHTML=`<button class=tablinks id=extra_button onclick="openTab(event,'extra')">${name}</button>`
                document.getElementById('extra_button').click()
            }

            async function closeExtraTab() {
                document.getElementById('extra').style.display = "none";
                document.getElementById('extra_tab').innerHTML='';
                onLoad()
            }

            async function onLoad() {
                document.getElementById('status_button').click()
            }
        </script>
    </head>
    <body onLoad=onLoad()>
	    <div class=tab>
            <button class=tablinks id=status_button onclick="openTab(event,'status')">status</button>
            <button class=tablinks id=log_button onclick="openTab(event,'log')">log</button>
            <button class=tablinks id=config_button onclick="openTab(event,'config')">config</button>
            <button class=tablinks id=sources_button onclick="openTab(event,'sources')">sources</button>
            <button class=tablinks id=lineup_button onclick="openTab(event,'lineup')">lineup</button>
            <span id=extra_tab></span>
	    </div>
        <div id=status class=tabcontent></div>
        <div id=log class=tabcontent><pre><span id=logdata></span></pre></div>
        <div id=sources class=tabcontent></div>
        <div id=config class=tabcontent></div>
        <div id=lineup class=tabcontent></div>
        <div id=extra class=tabcontent>
            <div align=right><button onclick="closeExtraTab()">&times;</button></div>
            <div id=extra_data></div>
        </div>
    </body>
</html>
